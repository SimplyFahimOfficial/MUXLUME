# CodeQL static analysis of the Kotlin and Java sources (security-extended queries).
#
# The pass/fail decision comes from scripts/ci/sarif_gate.py on the SARIF the analysis writes, so it
# works whether or not the repository has code scanning. Uploading results to the Security tab
# needs code scanning (public repository, or GitHub Code Security on a private one): it is enabled
# with the repository variable CODE_SCANNING_UPLOAD = 'true' and never happens for fork pull requests.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC: new queries and advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The CodeQL action reads workflow run metadata on private repositories.
      actions: read
      # Only used when results are uploaded (CODE_SCANNING_UPLOAD); fork PRs get a read-only token.
      security-events: write
    env:
      UPLOAD: ${{ vars.CODE_SCANNING_UPLOAD == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL observes the Kotlin and Java compilers, so the compile tasks must really run.
      - name: Compile for CodeQL
        run: ./gradlew --no-build-cache --rerun-tasks :app:compileFdroidDebugKotlin :app:compileFdroidDebugJavaWithJavac :app:compileGithubDebugKotlin :app:compileGithubDebugJavaWithJavac

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:java-kotlin
          output: ${{ runner.temp }}/codeql-results
          upload: ${{ env.UPLOAD == 'true' && 'always' || 'never' }}

      - name: Gate on high and critical findings
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/codeql-results/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error title=CodeQL::no SARIF output"; exit 1; fi
          rc=0
          for f in "${files[@]}"; do python3 scripts/ci/sarif_gate.py "$f" --fail-at high || rc=1; done
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql-results/
          retention-days: 14
          if-no-files-found: ignore
